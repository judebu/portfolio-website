<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Jude Hosmer</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    main { padding: 80px 20px; max-width:600px; margin:0 auto; color:white; }
    h1 { font-size:36px; margin-bottom:20px; text-align:center; }
    p { text-align:center; margin-bottom:10px; }
    a { color:#4a90e2; }

    form { background: rgba(46,46,46,0.5); padding:30px; border-radius:15px; display:flex; flex-direction:column; gap:15px; }
    .field { display:flex; flex-direction:column; }
    label { font-weight:600; margin-bottom:5px; color:#cfcfcf; }
    input[type="text"], input[type="email"], textarea { padding:10px; border:none; border-radius:8px; font-size:14px; background:#333; color:white; }
    input[type="text"]:focus, input[type="email"]:focus, textarea:focus { outline:2px solid #4a90e2; }
    textarea { min-height: 140px; resize: vertical; }
    #button { background:#4a90e2; color:white; font-weight:600; padding:12px; border:none; border-radius:10px; cursor:pointer; transition:0.3s; }
    #button:hover:not(:disabled) { background:#357ABD; }
    #button:disabled { cursor:not-allowed; opacity:0.7; }
    .form-status { min-height: 22px; margin: 0; text-align: left; font-size: 14px; color: #cfcfcf; }
    .form-status.success { color: #62d889; }
    .form-status.error { color: #ff7a7a; }
    @media (max-width:768px) {
      main { padding:40px 20px; }
      h1 { font-size:28px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">J <span>Jude Hosmer</span></a>
    <nav class="nav-menu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <main>
    <h1>Contact Me</h1>
    <p>Email: <a href="mailto:hosmerjude@gmail.com">hosmerjude@gmail.com</a></p>
    <p>Phone: 646 708 1889</p>
    <p>Feel free to reach out for opportunities or collaborations.</p>

    <form id="form">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" name="from_name" id="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" name="reply_to" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea name="message" id="message" required></textarea>
      </div>
      <input type="hidden" name="to_email" value="hosmerjude@gmail.com">
      <p class="form-status" id="form-status" aria-live="polite"></p>
      <input type="submit" id="button" value="Send Email">
    </form>
  </main>

  <script type="text/javascript">
    const emailConfig = {
      publicKey: 'JmYphf3DEmh3xw3FT',
      serviceID: 'default_service',
      templateID: 'template_83hkjjd'
    };

    emailjs.init({ publicKey: emailConfig.publicKey });

    const btn = document.getElementById('button');
    const status = document.getElementById('form-status');
    const form = document.getElementById('form');

    function setStatus(message, type = '') {
      status.textContent = message;
      status.className = `form-status ${type}`.trim();
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      btn.value = 'Sending...';
      btn.disabled = true;
      setStatus('');

      emailjs.sendForm(emailConfig.serviceID, emailConfig.templateID, this)
        .then(() => {
          setStatus('Message sent. I will get back to you soon.', 'success');
          this.reset();
        })
        .catch((err) => {
          console.error('EmailJS send failed:', err);
          setStatus('Message could not be sent. Please email me directly at hosmerjude@gmail.com.', 'error');
        })
        .finally(() => {
          btn.value = 'Send Email';
          btn.disabled = false;
        });
    });
  </script>
</body>
</html>
